<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RakshaMarg - SDMA Incident Dispatch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 32px 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .header h1 { font-size: 24px; }
    .header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .btn-test { background: #334155; color: #38bdf8; border: 1px solid #475569; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; }
    .stat-card .value { font-size: 28px; font-weight: bold; margin-top: 8px; }
    .map-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .map-header { padding: 16px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between;}
    #map { height: 400px; width: 100%; background: #1e293b; display: flex; justify-content: center; align-items: center; color: var(--text-muted); }
    .dark-tiles { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
    table { width: 100%; border-collapse: collapse; text-align: left; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
    th { background: #162032; padding: 14px; font-size: 12px; text-transform: uppercase; color: var(--text-muted); }
    td { padding: 14px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🛡️ RakshaMarg Command Center</h1>
        <p>Live Incident Dispatch Hub</p>
      </div>
      <button class="btn-test" id="btnTestSOS">🧪 Simulate Test SOS</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div style="font-size: 12px; color: var(--text-muted);">ACTIVE INCIDENTS</div>
        <div class="value" id="incidentCount">0</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 12px; color: var(--text-muted);">MONITORING</div>
        <div class="value">NH-29</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 12px; color: var(--text-muted);">SYSTEM STATUS</div>
        <div class="value" id="sysStatus" style="color: #22c55e;">Connecting...</div>
      </div>
    </div>
    <div class="map-panel">
      <div class="map-header">
        <span>📍 Real-Time Incident Map</span>
        <span style="font-size:12px; color:#94a3b8;">Auto-syncing every 3s...</span>
      </div>
      <div id="map">Loading map tiles...</div> 
    </div>
    <table>
      <thead>
        <tr>
          <th>Distress ID</th>
          <th>Traveler ID</th>
          <th>Coordinates</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="alertTableBody">
        <tr><td colspan="4" style="text-align: center; padding: 20px;">Waiting for alerts...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let map;
    let markersLayer;
    let localAlerts = [];
    const tableBody = document.getElementById('alertTableBody');
    const incidentCount = document.getElementById('incidentCount');
    const sysStatus = document.getElementById('sysStatus');

    document.addEventListener('DOMContentLoaded', () => {
      map = L.map('map').setView([25.6747, 94.1106], 8);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        className: 'dark-tiles',
        attribution: '© OpenStreetMap'
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => { map.invalidateSize(); }, 500);
      
      // 📡 THIS IS THE MISSING PIECE: Start polling the server every 3 seconds
      fetchLiveAlerts();
      setInterval(fetchLiveAlerts, 3000);
    });

    function updateDashboard(alerts) {
      incidentCount.innerText = alerts.length;
      markersLayer.clearLayers();
      tableBody.innerHTML = '';

      if (alerts.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">Waiting for alerts...</td></tr>';
        return;
      }

      alerts.forEach(alert => {
        const lat = alert.location?.latitude ? Number(alert.location.latitude) : null;
        const lng = alert.location?.longitude ? Number(alert.location.longitude) : null;
        const time = alert.receivedAt ? new Date(alert.receivedAt).toLocaleTimeString() : new Date().toLocaleTimeString();
        const tId = alert.travelerId || 'Unknown';
        const aId = alert.id || ('SOS-' + Math.floor(Math.random()*1000));

        if (lat && lng) {
          const marker = L.circleMarker([lat, lng], {
            radius: 10, fillColor: '#ef4444', color: '#fff', weight: 2, fillOpacity: 0.9
          }).addTo(markersLayer);
          marker.bindPopup('<b>' + aId + '</b><br>Vehicle: ' + tId);
        }

        tableBody.innerHTML += '<tr><td><strong>' + aId + '</strong></td><td>' + tId + '</td><td style="color: #38bdf8; font-family: monospace;">' + (lat?lat.toFixed(4):'--') + ', ' + (lng?lng.toFixed(4):'--') + '</td><td>' + time + '</td></tr>';
      });
    }

    // Connects to Shreyashi's backend server
    async function fetchLiveAlerts() {
      try {
        const response = await fetch('http://localhost:3000/api/alerts');
        if (response.ok) {
          const serverAlerts = await response.json();
          sysStatus.innerText = 'Online - Live';
          sysStatus.style.color = '#22c55e';
          updateDashboard([...serverAlerts, ...localAlerts]);
        }
      } catch (err) {
        sysStatus.innerText = 'Offline / Local';
        sysStatus.style.color = '#f59e0b';
        updateDashboard(localAlerts);
      }
    }

    // Simulated data button for testing
    document.getElementById('btnTestSOS').addEventListener('click', () => {
      localAlerts.unshift({
        id: 'SOS-' + Math.floor(Math.random() * 9000),
        travelerId: 'TEST-CAR-' + Math.floor(Math.random() * 99),
        location: { latitude: 25.6747 + (Math.random() - 0.5) * 0.2, longitude: 94.1106 + (Math.random() - 0.5) * 0.2 },
        receivedAt: new Date().toISOString()
      });
      updateDashboard(localAlerts);
    });
  </script>
</body>
</html>
